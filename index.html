<!DOCTYPE html>
<html lang="ar">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق اسلامي</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Tajawal', sans-serif;
background:linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
color:white;
display:flex;
justify-content:center;
min-height:100vh;
position:relative;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: 
        radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 1;
}

/* شاشة موبايل */
.app{
width:100%;
max-width:400px;
height:100vh;
display:flex;
flex-direction:column;
background:rgba(15, 23, 42, 0.9);
backdrop-filter:blur(20px);
position:relative;
z-index:2;
}

/* صفحات */
.pages{flex:1;overflow:auto;}
.page{display:none;padding:20px;}
.active{display:block;}

/* كروت */
.card{
background:linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
border-radius:25px;
padding:25px;
margin-bottom:20px;
text-align:center;
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 15px 35px rgba(0,0,0,0.3), 0 5px 15px rgba(0,0,0,0.2);
backdrop-filter:blur(15px);
position:relative;
overflow:hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
    animation: shimmer 4s ease-in-out infinite;
}

@keyframes shimmer {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(180deg); }
}

/* نصوص */
h1, h2, h3 {
    position: relative;
    z-index: 1;
}

#temp{font-size:56px;font-weight:900;background:linear-gradient(135deg, #ffd700, #ffed4e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(255,215,0,0.5);}
#city{font-size:20px;color:#87ceeb;margin-bottom:15px;}
#desc{font-size:18px;color:#98fb98;}

/* إيقونات الطقس */
.weather-icon {
    font-size: 80px;
    margin: 20px 0;
    animation: weatherAnimation 2s ease-in-out infinite;
}

@keyframes weatherAnimation {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.1) rotate(5deg); }
}

/* قمر متحرك */
.moon-icon {
    animation: moonGlow 3s ease-in-out infinite;
}

@keyframes moonGlow {
    0%, 100% { 
        transform: scale(1);
        filter: brightness(1);
    }
    50% { 
        transform: scale(1.05);
        filter: brightness(1.2);
    }
}

/* شمس متحركة */
.sun-icon {
    animation: sunRotate 10s linear infinite;
}

@keyframes sunRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* سحابة متحركة */
.cloud-icon {
    animation: cloudFloat 3s ease-in-out infinite;
}

@keyframes cloudFloat {
    0%, 100% { transform: translateX(0) translateY(0); }
    25% { transform: translateX(5px) translateY(-3px); }
    50% { transform: translateX(-5px) translateY(0); }
    75% { transform: translateX(3px) translateY(3px); }
}

/* مطر متحرك */
.rain-icon {
    animation: rainDrop 1s ease-in-out infinite;
}

@keyframes rainDrop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
}

/* ثلج متحرك */
.snow-icon {
    animation: snowFall 3s ease-in-out infinite;
}

@keyframes snowFall {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(10px) rotate(180deg); }
}

/* الساعة العقارب */
.clock-container {
    width: 180px;
    height: 180px;
    margin: 20px auto;
    position: relative;
}

.clock {
    width: 100%;
    height: 100%;
    border: 8px solid #ffd700;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(circle at center, #2c3e50 0%, #34495e 50%, #2c3e50 100%);
    box-shadow: 
        0 0 50px rgba(255, 215, 0, 0.3),
        inset 0 0 30px rgba(0, 0, 0, 0.5),
        0 10px 30px rgba(0, 0, 0, 0.4);
}

.clock-face {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
}

.hand {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center bottom;
    border-radius: 10px;
}

.hour-hand {
    width: 5px;
    height: 50px;
    background: linear-gradient(to bottom, #ffd700, #ffed4e);
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

.minute-hand {
    width: 3px;
    height: 65px;
    background: linear-gradient(to bottom, #87ceeb, #4682b4);
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 10px rgba(135, 206, 235, 0.5);
}

.second-hand {
    width: 2px;
    height: 75px;
    background: linear-gradient(to bottom, #ff6b6b, #ee5a24);
    transform: translate(-50%, -100%) rotate(0deg);
    box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
}

.center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle, #ffd700, #ffed4e);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
}

.clock-numbers {
    position: absolute;
    width: 100%;
    height: 100%;
}

.clock-number {
    position: absolute;
    font-size: 14px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

.clock-number.twelve { top: 8px; left: 50%; transform: translateX(-50%); }
.clock-number.three { right: 8px; top: 50%; transform: translateY(-50%); }
.clock-number.six { bottom: 8px; left: 50%; transform: translateX(-50%); }
.clock-number.nine { left: 8px; top: 50%; transform: translateY(-50%); }

.digital-time {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #87ceeb;
    margin-top: 15px;
    text-shadow: 0 0 20px rgba(135, 206, 235, 0.5);
}

/* مسبحة */
.tasbeeh{
font-size:48px;
margin:25px;
background:linear-gradient(135deg, #ffd700, #ffed4e);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 30px rgba(255,215,0,0.5);
}

/* قبلة */
#arrow{
width:6px;
height:120px;
background:linear-gradient(to top, #ffd700, #ffed4e);
margin:30px auto;
transform-origin:bottom;
border-radius:3px;
box-shadow:0 0 30px rgba(255,215,0,0.5);
}

.compass-rose {
    width: 200px;
    height: 200px;
    margin: 20px auto;
    position: relative;
}

.compass-circle {
    width: 100%;
    height: 100%;
    border: 3px solid #ffd700;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(circle at center, rgba(255,215,0,0.1) 0%, transparent 70%);
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
}

.compass-direction {
    position: absolute;
    font-size: 16px;
    font-weight: bold;
    color: #ffd700;
}

.compass-direction.n { top: 5px; left: 50%; transform: translateX(-50%); }
.compass-direction.e { right: 5px; top: 50%; transform: translateY(-50%); }
.compass-direction.s { bottom: 5px; left: 50%; transform: translateX(-50%); }
.compass-direction.w { left: 5px; top: 50%; transform: translateY(-50%); }
.compass-direction.q { top: 25%; right: 25%; color: #ff6b6b; }

/* أزرار */
button{
background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
border:2px solid rgba(255,255,255,0.3);
color:white;
padding:15px 25px;
border-radius:15px;
margin:8px;
cursor:pointer;
font-size:14px;
font-weight:600;
transition:all 0.3s ease;
box-shadow:0 8px 25px rgba(102, 126, 234, 0.3);
position:relative;
overflow:hidden;
}

button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
}

button:hover::before {
    left: 100%;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 15px 35px rgba(102, 126, 234, 0.4);
border-color:rgba(255,255,255,0.5);
}

button:active{
transform:translateY(-1px);
}

/* القائمة */
.nav{
height:70px;
background:linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
display:flex;
border-top:2px solid rgba(255,215,0,0.3);
box-shadow:0 -5px 20px rgba(0,0,0,0.3);
}

.nav button{
flex:1;
border:none;
background:none;
color:#ffd700;
font-size:12px;
font-weight:600;
transition:all 0.3s ease;
position:relative;
}

.nav button::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 3px;
    background: #ffd700;
    transform: translateX(-50%);
    transition: width 0.3s ease;
}

.nav button:hover::after {
    width: 80%;
}

.nav button:hover{
background:rgba(255,215,0,0.1);
color:#fff;
}

/* باب المسجد */
.mosque-door {
    width: 100%;
    height: 300px;
    position: relative;
    margin: 20px 0;
    perspective: 1000px;
}

.door-frame {
    width: 100%;
    height: 100%;
    position: relative;
    background: linear-gradient(135deg, #8b4513 0%, #a0522d 50%, #cd853f 100%);
    border-radius: 20px 20px 0 0;
    box-shadow: 
        0 10px 30px rgba(0,0,0,0.5),
        inset 0 0 20px rgba(0,0,0,0.3);
}

.door-arch {
    width: 80%;
    height: 80%;
    position: absolute;
    top: 10%;
    left: 10%;
    background: linear-gradient(135deg, #654321 0%, #8b4513 50%, #a0522d 100%);
    border-radius: 50% 50% 0 0;
    box-shadow: 
        inset 0 5px 15px rgba(0,0,0,0.5),
        0 0 20px rgba(255,215,0,0.2);
}

.door-left, .door-right {
    position: absolute;
    width: 50%;
    height: 100%;
    background: linear-gradient(135deg, #8b4513 0%, #a0522d 50%, #cd853f 100%);
    box-shadow: 
        inset 0 0 15px rgba(0,0,0,0.3),
        0 0 10px rgba(255,215,0,0.1);
    transition: all 1s ease-in-out;
    transform-origin: center;
}

.door-left {
    left: 0;
    border-radius: 50% 0 0 0;
    border-right: 2px solid #654321;
}

.door-right {
    right: 0;
    border-radius: 0 50% 0 0;
    border-left: 2px solid #654321;
}

.door-open .door-left {
    transform: rotateY(-80deg);
}

.door-open .door-right {
    transform: rotateY(80deg);
}

.door-handle {
    position: absolute;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle, #ffd700, #ffed4e);
    border-radius: 50%;
    top: 50%;
    box-shadow: 0 0 15px rgba(255,215,0,0.8);
}

.door-left .door-handle {
    right: 10px;
}

.door-right .door-handle {
    left: 10px;
}

.prayer-content {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.95) 100%);
    border-radius: 20px 20px 0 0;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: all 1s ease-in-out 0.5s;
    overflow-y: auto;
    backdrop-filter: blur(10px);
}

.door-open .prayer-content {
    opacity: 1;
    visibility: visible;
}

.door-decoration {
    position: absolute;
    color: #ffd700;
    font-size: 24px;
    text-shadow: 0 0 15px rgba(255,215,0,0.8);
}

.door-decoration.top {
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
}

.door-decoration.left {
    left: 5px;
    top: 50%;
    transform: translateY(-50%);
}

.door-decoration.right {
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
}
.prayer-time {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    margin: 10px 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.2);
    transition: all 0.3s ease;
}

.prayer-time:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    background: linear-gradient(135deg, rgba(255,215,0,0.1) 0%, rgba(255,215,0,0.05) 100%);
}

.prayer-name {
    font-size: 16px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,215,0,0.3);
}

.prayer-time-value {
    font-size: 16px;
    font-weight: bold;
    color: #87ceeb;
    text-shadow: 0 0 10px rgba(135,206,235,0.3);
}

/* أيقونات المسجد */
.mosque-icon {
    font-size: 40px;
    margin-bottom: 15px;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

/* Mobile optimizations */
@media (max-width: 400px) {
    .app {
        max-width:100%;
    }
    
    .card {
        padding:20px;
        margin-bottom:15px;
    }
    
    .clock-container {
        width: 150px;
        height: 150px;
        margin: 15px auto;
    }
    
    .hour-hand { height: 40px; }
    .minute-hand { height: 50px; }
    .second-hand { height: 60px; }
    
    .clock-number { font-size: 12px; }
    .digital-time { font-size: 16px; }
    
    #temp { font-size: 48px; }
    .tasbeeh { font-size: 40px; }
    
    button {
        padding:12px 20px;
        font-size:13px;
    }
    
    .nav {
        height:60px;
    }
    
    .mosque-door {
        height: 250px;
        margin: 15px 0;
    }
    
    .door-decoration {
        font-size: 18px;
    }
}
</style>
</head>
<body>

<div class="app">

<div class="pages">

<!-- الطقس -->
<div id="weather" class="page active">
<div class="card">
<div class="mosque-icon">🕌</div>
<h2 id="city">جاري التحميل...</h2>
<div class="weather-icon" id="weatherIcon">🌤️</div>
<h1 id="temp">--</h1>
<h3 id="desc">--</h3>
</div>
</div>

<!-- الصلاة -->
<div id="prayer" class="page">
<div class="card">
<div class="mosque-icon">📿</div>
<h2 style="color:#ffd700;margin-bottom:20px;">مواقيت الصلاة</h2>
<div class="mosque-door" id="mosqueDoor">
    <div class="door-frame">
        <div class="door-arch">
            <div class="door-decoration top">🌙</div>
            <div class="door-decoration left">✨</div>
            <div class="door-decoration right">✨</div>
            <div class="door-left">
                <div class="door-handle"></div>
            </div>
            <div class="door-right">
                <div class="door-handle"></div>
            </div>
        </div>
    </div>
    <div class="prayer-content" id="prayerContent">
        <h3 style="color:#ffd700;text-align:center;margin-bottom:20px;">مواقيت الصلاة اليوم</h3>
        <div id="prayerTimes">جاري التحميل...</div>
        <div style="text-align:center;margin-top:15px;">
            <button onclick="testAdhan()" style="background:linear-gradient(135deg, #22c55e 0%, #16a34a 100%);font-size:12px;padding:8px 15px;">🔊 اختبار الأذان</button>
            <button onclick="toggleAdhanSound()" id="soundToggle" style="background:linear-gradient(135deg, #ef4444 0%, #dc2626 100%);font-size:12px;padding:8px 15px;">🔇 كتم الصوت</button>
        </div>
    </div>
</div>
</div>
</div>

<!-- القبلة -->
<div id="qibla" class="page">
<div class="card">
<div class="mosque-icon">🧭</div>
<h2 style="color:#ffd700;margin-bottom:20px;">اتجاه القبلة</h2>
<div class="compass-rose">
    <div class="compass-circle">
        <div class="compass-direction n">N</div>
        <div class="compass-direction e">E</div>
        <div class="compass-direction s">S</div>
        <div class="compass-direction w">W</div>
        <div class="compass-direction q">ق</div>
        <div id="arrow"></div>
    </div>
</div>
<p id="qdir" style="font-size:18px;color:#ffd700;margin-top:15px;">--</p>
</div>
</div>

<!-- مسبحة -->
<div id="tasbeeh" class="page">
<div class="card">
<div class="mosque-icon">🧿</div>
<h2 style="color:#ffd700;margin-bottom:20px;">المسبحة الإلكترونية</h2>
<div class="tasbeeh" id="count">0</div>
<button onclick="inc()">تسبيح</button>
<button onclick="reset()">تصفير</button>
</div>
</div>

<!-- ساعة -->
<div id="clockPage" class="page">
<div class="card">
<div class="mosque-icon">⏰</div>
<h2 style="color:#ffd700;margin-bottom:20px;">الساعة</h2>
<div class="clock-container">
    <div class="clock">
        <div class="clock-face">
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>
            <div class="center-dot"></div>
        </div>
        <div class="clock-numbers">
            <div class="clock-number twelve">12</div>
            <div class="clock-number three">3</div>
            <div class="clock-number six">6</div>
            <div class="clock-number nine">9</div>
        </div>
    </div>
</div>
<div class="digital-time" id="digitalTime">00:00:00</div>
</div>
</div>

</div>

<!-- القائمة -->
<div class="nav">
<button onclick="show('weather')">🌦️ طقس</button>
<button onclick="show('prayer')">🕌 صلاة</button>
<button onclick="show('qibla')">🧭 قبلة</button>
<button onclick="show('tasbeeh')">🧿 مسبحة</button>
<button onclick="show('clockPage')">⏰ ساعة</button>
</div>

</div>

<script>

// تبديل الصفحات
function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
    
    // فتح باب المسجد عند الدخول لصفحة الصلاة
    if (id === 'prayer') {
        setTimeout(() => {
            document.getElementById('mosqueDoor').classList.add('door-open');
        }, 300);
    } else {
        // غلق الباب عند الخروج
        document.getElementById('mosqueDoor').classList.remove('door-open');
    }
}

// ساعة عقارب
function updateClock() {
    const now = new Date();
    const hours = now.getHours() % 12;
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    
    const hourDeg = (hours * 30) + (minutes * 0.5);
    const minuteDeg = minutes * 6;
    const secondDeg = seconds * 6;
    
    document.getElementById('hourHand').style.transform = `translate(-50%, -100%) rotate(${hourDeg}deg)`;
    document.getElementById('minuteHand').style.transform = `translate(-50%, -100%) rotate(${minuteDeg}deg)`;
    document.getElementById('secondHand').style.transform = `translate(-50%, -100%) rotate(${secondDeg}deg)`;
    
    const timeString = now.toLocaleTimeString();
    document.getElementById('digitalTime').textContent = timeString;
}

setInterval(updateClock, 1000);
updateClock();

// مسبحة
let c=0;
function inc(){c++;document.getElementById("count").innerText=c;}
function reset(){c=0;document.getElementById("count").innerText=c;}

// 🕌 صوت الأذان
let adhanEnabled = true;
let adhanAudio = null;
let prayerTimes = {};
let lastPlayedPrayer = "";

// تهيئة صوت الأذان
function initAdhan() {
    adhanAudio = new Audio('https://www.islamicfinder.org/audio/adhan/Adhan-Ahmad-Nuaim-Makkah.mp3');
    adhanAudio.volume = 0.7;
}

// تشغيل الأذان
function playAdhan() {
    if (!adhanEnabled || !adhanAudio) return;
    
    try {
        adhanAudio.currentTime = 0;
        adhanAudio.play().catch(e => {
            console.log('لا يمكن تشغيل الأذان:', e);
        });
    } catch(e) {
        console.log('خطأ في تشغيل الأذان:', e);
    }
}

// اختبار الأذان
function testAdhan() {
    if (!adhanAudio) {
        initAdhan();
    }
    playAdhan();
}

// تشغيل/كتم الصوت
function toggleAdhanSound() {
    adhanEnabled = !adhanEnabled;
    const btn = document.getElementById('soundToggle');
    if (adhanEnabled) {
        btn.innerHTML = '🔇 كتم الصوت';
        btn.style.background = 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)';
    } else {
        btn.innerHTML = '🔊 تشغيل الصوت';
        btn.style.background = 'linear-gradient(135deg, #22c55e 0%, #16a34a 100%)';
        if (adhanAudio) {
            adhanAudio.pause();
        }
    }
}

// التحقق من وقت الصلاة
function checkPrayerTimes() {
    if (!adhanEnabled || !prayerTimes.Fajr) return;
    
    const now = new Date();
    const currentTime = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
    
    const prayers = [
        { name: 'الفجر', time: prayerTimes.Fajr, played: 'fajrPlayed' },
        { name: 'الظهر', time: prayerTimes.Dhuhr, played: 'dhuhrPlayed' },
        { name: 'العصر', time: prayerTimes.Asr, played: 'asrPlayed' },
        { name: 'المغرب', time: prayerTimes.Maghrib, played: 'maghribPlayed' },
        { name: 'العشاء', time: prayerTimes.Isha, played: 'ishaPlayed' }
    ];
    
    prayers.forEach(prayer => {
        if (currentTime === prayer.time && lastPlayedPrayer !== prayer.name) {
            console.log('حان وقت صلاة ' + prayer.name);
            playAdhan();
            lastPlayedPrayer = prayer.name;
            
            // إشعار للمستخدم
            showNotification('حان وقت صلاة ' + prayer.name);
        }
    });
}

// إشعار للمستخدم
function showNotification(message) {
    // التحقق من دعم الإشعارات
    if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('تطبيق إسلامي', {
            body: message,
            icon: '🕌',
            sound: 'https://www.islamicfinder.org/audio/adhan/Adhan-Ahmad-Nuaim-Makkah.mp3'
        });
    } else if ('Notification' in window && Notification.permission !== 'denied') {
        Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
                new Notification('تطبيق إسلامي', {
                    body: message,
                    icon: '🕌'
                });
            }
        });
    }
    
    // إشعار مرئي داخل التطبيق
    const notificationDiv = document.createElement('div');
    notificationDiv.style.cssText = `
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #ffd700, #ffed4e);
        color: #1e293b;
        padding: 15px 25px;
        border-radius: 15px;
        font-weight: bold;
        z-index: 9999;
        box-shadow: 0 10px 30px rgba(255,215,0,0.5);
        animation: slideDown 0.5s ease-out;
    `;
    notificationDiv.textContent = '🕌 ' + message;
    document.body.appendChild(notificationDiv);
    
    setTimeout(() => {
        notificationDiv.remove();
    }, 5000);
}

// إضافة حركة الإشعار
const style = document.createElement('style');
style.textContent = `
    @keyframes slideDown {
        from {
            transform: translateX(-50%) translateY(-100%);
            opacity: 0;
        }
        to {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    }
`;
document.head.appendChild(style);

// 🌦️ الطقس
function weather(lat,lon){
fetch(`https://api.weatherapi.com/v1/current.json?key=62647a895cc24533a7f120015260204&q=${lat},${lon}`)
.then(r=>r.json())
.then(d=>{
let temp = d.current.temp_c;
let condition = d.current.condition.text.toLowerCase();
let rain = d.current.precip_mm;
let cloud = d.current.cloud;
let isNight = d.current.is_day === 0;

// عرض المدينة والدرجة
document.getElementById("city").innerText = d.location.name;
document.getElementById("temp").innerText = temp + "°C";

// ترجمة وتحديد الإيقونة والوصف العربي
let arabicDesc = "";
let weatherIcon = "";
let iconClass = "";

if (isNight && (condition.includes("clear") || condition.includes("sunny"))) {
    arabicDesc = "🌙 ليل صافي";
    weatherIcon = "🌙";
    iconClass = "moon-icon";
} else if (!isNight && (condition.includes("sunny") || condition.includes("clear"))) {
    arabicDesc = "☀️ مشمس";
    weatherIcon = "☀️";
    iconClass = "sun-icon";
} else if (condition.includes("partly cloudy") || condition.includes("partly sunny")) {
    arabicDesc = "⛅ غائم جزئي";
    weatherIcon = "⛅";
    iconClass = "cloud-icon";
} else if (condition.includes("cloudy") || condition.includes("overcast")) {
    arabicDesc = "☁️ غائم";
    weatherIcon = "☁️";
    iconClass = "cloud-icon";
} else if (condition.includes("rain") || condition.includes("drizzle") || rain > 0) {
    arabicDesc = "🌧️ ممطر";
    weatherIcon = "🌧️";
    iconClass = "rain-icon";
} else if (condition.includes("snow") || condition.includes("blizzard")) {
    arabicDesc = "❄️ ثلجي";
    weatherIcon = "❄️";
    iconClass = "snow-icon";
} else if (condition.includes("thunder") || condition.includes("storm")) {
    arabicDesc = "⛈️ عاصف";
    weatherIcon = "⛈️";
    iconClass = "rain-icon";
} else if (condition.includes("fog") || condition.includes("mist")) {
    arabicDesc = "🌫ى ضبابي";
    weatherIcon = "🌫️";
    iconClass = "cloud-icon";
} else if (condition.includes("windy")) {
    arabicDesc = "💨 عاصف رياح";
    weatherIcon = "💨";
    iconClass = "cloud-icon";
} else if (isNight) {
    arabicDesc = "� ليل غائم جزئي";
    weatherIcon = "☁️";
    iconClass = "cloud-icon";
} else {
    arabicDesc = "�🌤️ غائم جزئي";
    weatherIcon = "🌤️";
    iconClass = "cloud-icon";
}

// تحديث الوصف والإيقونة
document.getElementById("desc").innerText = arabicDesc;
let iconElement = document.getElementById("weatherIcon");
iconElement.innerText = weatherIcon;
iconElement.className = "weather-icon " + iconClass;

// تغيير خلفية التطبيق حسب الطقس والوقت
let body = document.body;
if (isNight && (condition.includes("clear") || condition.includes("sunny"))) {
    body.style.background = "linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%)";
} else if (!isNight && (condition.includes("sunny") || condition.includes("clear"))) {
    body.style.background = "linear-gradient(135deg, #f59e0b 0%, #f97316 50%, #ea580c 100%)";
} else if (condition.includes("rain") || condition.includes("drizzle") || rain > 0) {
    body.style.background = "linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #1d4ed8 100%)";
} else if (condition.includes("cloudy") || condition.includes("overcast")) {
    body.style.background = "linear-gradient(135deg, #374151 0%, #4b5563 50%, #6b7280 100%)";
} else if (condition.includes("snow") || condition.includes("blizzard")) {
    body.style.background = "linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 50%, #a5b4fc 100%)";
} else if (isNight) {
    body.style.background = "linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%)";
} else {
    body.style.background = "linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%)";
}

})
.catch(()=>{
document.getElementById("city").innerText="خطأ بالطقس";
document.getElementById("desc").innerText="لا يمكن جلب البيانات";
document.getElementById("weatherIcon").innerText="❌";
});
}

// 🕌 الصلاة
function prayer(lat,lon){
fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=5`)
.then(r=>r.json())
.then(d=>{
let t=d.data.timings;
prayerTimes = t; // حفظ أوقات الصلاة للتحقق

document.getElementById("prayerTimes").innerHTML=
`<div class="prayer-time">
    <span class="prayer-name">الفجر</span>
    <span class="prayer-time-value">${t.Fajr}</span>
</div>
<div class="prayer-time">
    <span class="prayer-name">الظهر</span>
    <span class="prayer-time-value">${t.Dhuhr}</span>
</div>
<div class="prayer-time">
    <span class="prayer-name">العصر</span>
    <span class="prayer-time-value">${t.Asr}</span>
</div>
<div class="prayer-time">
    <span class="prayer-name">المغرب</span>
    <span class="prayer-time-value">${t.Maghrib}</span>
</div>
<div class="prayer-time">
    <span class="prayer-name">العشاء</span>
    <span class="prayer-time-value">${t.Isha}</span>
</div>`;

// تهيئة صوت الأذان إذا لم يتم تهيئته
if (!adhanAudio) {
    initAdhan();
}
})
.catch(()=>{
document.getElementById("prayerTimes").innerHTML='<div style="color:#ff6b6b;">خطأ بجلب التوقيتات</div>';
});
}

// 🧭 القبلة
const k={lat:21.4225,lon:39.8262};

function qibla(lat,lon){
let φ1=lat*Math.PI/180;
let φ2=k.lat*Math.PI/180;
let Δλ=(k.lon-lon)*Math.PI/180;

let y=Math.sin(Δλ);
let x=Math.cos(φ1)*Math.tan(φ2)-Math.sin(φ1)*Math.cos(Δλ);

let q=(Math.atan2(y,x)*180/Math.PI+360)%360;

window.addEventListener("deviceorientation",e=>{
if(e.alpha !== null){
let dir=q-e.alpha;
document.getElementById("arrow").style.transform=`rotate(${dir}deg)`;
document.getElementById("qdir").innerText=`اتجاه القبلة: ${Math.round(q)}°`;
}
});
}

// 📍 GPS + fallback قوي
function startApp(){

navigator.geolocation.getCurrentPosition(pos=>{

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

weather(lat,lon);
prayer(lat,lon);
qibla(lat,lon);

// بدء التحقق من أوقات الصلاة كل دقيقة
setInterval(checkPrayerTimes, 60000);
checkPrayerTimes(); // تحقق فوري

},()=>{

// fallback بغداد 💣
let lat=33.3152;
let lon=44.3661;

weather(lat,lon);
prayer(lat,lon);
qibla(lat,lon);

// بدء التحقق من أوقات الصلاة كل دقيقة
setInterval(checkPrayerTimes, 60000);
checkPrayerTimes(); // تحقق فوري

});

}

startApp();

</script>
