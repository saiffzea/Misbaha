<!DOCTYPE html>
<html lang="ar">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق اسلامي</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:sans-serif;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
}

/* شاشة موبايل */
.app{
width:100%;
max-width:400px;
height:100vh;
display:flex;
flex-direction:column;
background:linear-gradient(#1e293b,#0f172a);
}

/* صفحات */
.pages{flex:1;overflow:auto;}
.page{display:none;padding:15px;}
.active{display:block;}

/* كروت */
.card{
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:15px;
margin-bottom:15px;
text-align:center;
}

/* نصوص */
#temp{font-size:50px;}
#clock{font-size:40px;margin-top:20px;}
.tasbeeh{font-size:40px;margin:20px;}

/* قبلة */
#arrow{
width:4px;
height:100px;
background:cyan;
margin:30px auto;
transform-origin:bottom;
}

/* القائمة */
.nav{
height:60px;
background:#111;
display:flex;
}

.nav button{
flex:1;
border:none;
background:none;
color:white;
font-size:12px;
}
</style>
</head>

<body>

<div class="app">

<div class="pages">

<!-- الطقس -->
<div id="weather" class="page active">
<div class="card">
<h2 id="city">جاري التحميل...</h2>
<h1 id="temp">--</h1>
<h3 id="desc">--</h3>
</div>
</div>

<!-- الصلاة -->
<div id="prayer" class="page">
<div class="card" id="prayerTimes">جاري التحميل...</div>
</div>

<!-- القبلة -->
<div id="qibla" class="page">
<div class="card">
<div id="arrow"></div>
<p id="qdir">--</p>
</div>
</div>

<!-- مسبحة -->
<div id="tasbeeh" class="page">
<div class="card">
<div class="tasbeeh" id="count">0</div>
<button onclick="inc()">تسبيح</button>
<button onclick="reset()">تصفير</button>
</div>
</div>

<!-- ساعة -->
<div id="clockPage" class="page">
<div class="card">
<h1 id="clock"></h1>
</div>
</div>

</div>

<!-- القائمة -->
<div class="nav">
<button onclick="show('weather')">طقس</button>
<button onclick="show('prayer')">صلاة</button>
<button onclick="show('qibla')">قبلة</button>
<button onclick="show('tasbeeh')">مسبحة</button>
<button onclick="show('clockPage')">ساعة</button>
</div>

</div>

<script>

// تبديل الصفحات
function show(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

// ساعة
setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleTimeString();
},1000);

// مسبحة
let c=0;
function inc(){c++;document.getElementById("count").innerText=c;}
function reset(){c=0;document.getElementById("count").innerText=c;}

// 🌦️ الطقس
function weather(lat,lon){
fetch(`https://api.weatherapi.com/v1/current.json?key=62647a895cc24533a7f120015260204&q=${lat},${lon}`)
.then(r=>r.json())
.then(d=>{
document.getElementById("city").innerText=d.location.name;
document.getElementById("temp").innerText=d.current.temp_c+"°C";
document.getElementById("desc").innerText=d.current.condition.text;
})
.catch(()=>{
document.getElementById("city").innerText="خطأ بالطقس";
});
}

// 🕌 الصلاة
function prayer(lat,lon){
fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=5`)
.then(r=>r.json())
.then(d=>{
let t=d.data.timings;
document.getElementById("prayerTimes").innerHTML=
`الفجر ${t.Fajr}<br>
الظهر ${t.Dhuhr}<br>
العصر ${t.Asr}<br>
المغرب ${t.Maghrib}<br>
العشاء ${t.Isha}`;
})
.catch(()=>{
document.getElementById("prayerTimes").innerText="خطأ بجلب التوقيتات";
});
}

// 🧭 القبلة
const k={lat:21.4225,lon:39.8262};

function qibla(lat,lon){
let φ1=lat*Math.PI/180;
let φ2=k.lat*Math.PI/180;
let Δλ=(k.lon-lon)*Math.PI/180;

let y=Math.sin(Δλ);
let x=Math.cos(φ1)*Math.tan(φ2)-Math.sin(φ1)*Math.cos(Δλ);

let q=(Math.atan2(y,x)*180/Math.PI+360)%360;

window.addEventListener("deviceorientation",e=>{
if(e.alpha !== null){
let dir=q-e.alpha;
document.getElementById("arrow").style.transform=`rotate(${dir}deg)`;
document.getElementById("qdir").innerText=Math.round(q)+"°";
}
});
}

// 📍 GPS + fallback قوي
function startApp(){

navigator.geolocation.getCurrentPosition(pos=>{

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

weather(lat,lon);
prayer(lat,lon);
qibla(lat,lon);

},()=>{

// fallback بغداد 💣
let lat=33.3152;
let lon=44.3661;

weather(lat,lon);
prayer(lat,lon);
qibla(lat,lon);

});

}

startApp();

</script>

</body>
</html>
